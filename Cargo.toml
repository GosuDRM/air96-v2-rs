[package]
name = "air96-v2"
version = "4.9.1"
edition = "2021"
authors = ["GosuDRM"]
description = "Air96 V2 wireless keyboard firmware — Rust (stm32f0xx-hal)"
license = "GPL-2.0-or-later"
repository = "https://github.com/GosuDRM/air96-v2-rs"

[dependencies]
heapless = "0.8"

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32f0xx-hal = { version = "0.18.0", features = ["stm32f072", "rt", "stm32-usbd"] }

# USB HID (wired mode)
usb-device = "0.2"

[patch.crates-io]
# usb-device 0.2.9 with bcdUSB 2.00 (it hardcodes 2.10); QMK/ChibiOS reports 2.00.
usb-device = { path = "vendor/usb-device-0.2.9" }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
debug = false
lto = true
codegen-units = 1
panic = "abort"

[lib]
crate-type = ["lib"]
name = "air96_v2"
