[package]
name = "air96-v2"
version = "4.8.2"
edition = "2021"
authors = ["GosuDRM"]
description = "Air96 V2 wireless keyboard firmware — Rust (stm32f0xx-hal)"

[dependencies]

embedded-hal = "1.0"
embedded-io = "0.6"
heapless = "0.8"

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32f0xx-hal = { version = "0.18.0", features = ["stm32f072", "rt", "stm32-usbd"] }
nb = "1.1.0"

# USB HID (wired mode)
usb-device = "0.2"
usbd-hid = "0.6"

[patch.crates-io]
# Keep the usb-device 0.2-compatible usbd-hid line, but carry the upstream
# 0.7.x short SET_REPORT buffer fixes locally. usbd-hid 0.7 pulls usb-device
# 0.3, which is not compatible with the current stm32f0xx-hal/stm32-usbd stack.
usbd-hid = { path = "vendor/usbd-hid-0.6.2" }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
debug = false
lto = true
codegen-units = 1
panic = "abort"

[lib]
crate-type = ["lib"]
name = "air96_v2"
